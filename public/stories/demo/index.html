<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyline Placeholder</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      max-width: 520px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }
    p { margin: 8px 0; line-height: 1.5; }
    code {
      background: #0b1220;
      padding: 2px 6px;
      border-radius: 6px;
      color: #7dd3fc;
      font-size: 0.95rem;
    }
    .hint {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Storyline İçeriği Yeri</h1>
    <p>Burada Storyline publish çıktısını servis edeceksiniz.</p>
    <p class="hint">Adımlar:</p>
    <p class="hint">1) Kullanıcıdan gelen zip'i <code>public/stories/&lt;kurs-adi&gt;/</code> altına açın.</p>
    <p class="hint">2) Giriş dosyası genelde <code>story.html</code> (veya <code>index.html</code>).</p>
    <p class="hint">3) Uygulamada bu dosyayı yükleyip gösterin.</p>
  </main>
</body>
</html>
